remote_theme: "keikai/minimal-mistakes@keikai"
plugins:
  - jekyll-remote-theme
  - jekyll-include-cache  #required by minimal-mistakes
  - jekyll-paginate
  - jekyll-sitemap
minimal_mistakes_skin: "dirt"
title: "KEIKAI"
title_link: "https://keikai.io"
name: "Potix Corporation"
url: "https://doc.keikai.io"

search                    : true
search_full_content       : true
#  Lunr search only indexes collection documents e.g. posts or any custom collections you have. It does not currently index site.pages.';
search_provider: google
google:
  search_engine_id: 014994008257058938644:cb7qedcky7m


analytics:
  provider: "google-gtag"
  google:
    tracking_id: "G-6GR1K96LB8"
    policy_url: "https://keikai.io/privacy"

defaults:
  - scope:
      path: ""
    values:
      layout: single
      toc: true
      comments: true
      share: true
  - scope:
      path: "dev-ref"
    values:
      sidebar:
        nav: "dev-ref"
  - scope:
      path: "tutorial"
    values:
      sidebar:
        nav: "tutorial"
  # Axyra Sheets is a separate product: its own sidebars, never the Keikai ones.
  - scope:
      path: "axyra"
    values:
      sidebar:
        nav: "axyra"
  - scope:
      path: "axyra/tutorial"
    values:
      sidebar:
        nav: "axyra-tutorial"
  - scope:
      path: "axyra/dev-ref"
    values:
      sidebar:
        nav: "axyra-dev-ref"
  # Task-oriented articles that answer a search query, as opposed to the
  # learning path (axyra/quick-start) or the API reference (axyra/dev-ref). They
  # are entry points: each one links into the reference rather than restating
  # it, so the two never compete for the same query.
  - scope:
      path: "axyra/guides"
    values:
      sidebar:
        nav: "axyra-guides"

# disqus admin is hawkchen@potix.com
    
#repository: "username/repo-name"
#logo: "/assets/images/88x88.png"
# predefined properties
# base path of developer reference
devref: "/dev-ref"
devref_image_folder: "/assets/images/dev-ref"
baseurl_javadoc_keikai: "https://keikai.io/javadoc/spreadsheet/latest/"
# base paths of the Axyra Sheets documentation (a separate product from Keikai
# Spreadsheet -- keep these prefixes distinct from devref/tutorial above)
axyra: "/axyra"
# Where the Axyra masthead title leaves for, from the documentation overview
# page only (the Axyra counterpart of `title_link`). Point this at the public
# product page at release.
axyra_site_link: "https://keikai.io/axyra"
axyra_tutorial: "/axyra/quick-start"
axyra_guides: "/axyra/guides"
axyra_devref: "/axyra/dev-ref"
axyra_image_folder: "/assets/images/axyra"
axyra_javadoc: "https://keikai.io/javadoc/axyra-sheets/latest/index.html"
axyra_version: "1.0.0-Beta-Eval"
# Axyra Sheets is not on Maven Central. Public examples use the evaluation
# build; authenticated EE customers can use the commercial repository below.
axyra_repo_url: "https://mavensync.zkoss.org/eval"
axyra_repo_id: "keikai-eval"
axyra_ee_version: "1.0.0-Beta"
axyra_ee_repo_url: "https://maven.zkoss.org/repo/keikai/ee"
axyra_ee_repo_id: "keikai-ee"
# Optional email capture and lead routing on the Axyra pages.
# Developer updates: the download dialog posts the email straight to the
# keikai.io mail service (updates_endpoint; it must allow this site's origin).
# Other links, and the dialog when that post fails, open the keikai.io contact
# form prefilled (product and message in the query, email in the #fragment so it
# never reaches server logs or analytics). Local previews never post.
# Evaluation requests and commercial inquiries use the forms in
# _includes/axyra_lead_form.html: leave an endpoint empty to run that form in
# preview mode (it validates and shows the payload, but sends nothing).
axyra_leads:
  campaign: "axyra_skills_pilot"
  contact_url: "https://keikai.io/contact/"
  updates_endpoint: "https://keikai.io/contact/mail/"
  privacy_url: "https://keikai.io/privacy/"
  unsubscribe_email: "axyra@keikai.io"
  updates_product: "Axyra"
  updates_message: "Send me Axyra tips, examples, and product updates."
  evaluation_endpoint: ""
  commercial_endpoint: ""
# Setting `exclude` REPLACES Jekyll's defaults rather than adding to them, so the
# default entries have to be repeated here. Without them a local
# `bundle config set --local path vendor/bundle` makes Jekyll try to build the
# gems under vendor/, which fails on jekyll's own site_template .erb posts.
exclude:
  - skills/
  - scripts/package-axyra-skill.py
  - CLAUDE.md
  - README.md
  - .bundle/
  - vendor/
  - Gemfile
  - Gemfile.lock
  - gemfiles/
  - node_modules/
  - .sass-cache/
  - .jekyll-cache/
  - preview.sh
  - tasks
